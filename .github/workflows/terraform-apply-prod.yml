name: Terraform Apply Prod

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soh-api-terraform-apply-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  apply:
    name: Terraform apply prod
    runs-on: ubuntu-latest
    environment: production-infra

    defaults:
      run:
        working-directory: infra/terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write Terraform variables
        env:
          TERRAFORM_TFVARS: ${{ secrets.SOH_TERRAFORM_TFVARS_PROD }}
        run: |
          if [ -z "$TERRAFORM_TFVARS" ]; then
            echo "SOH_TERRAFORM_TFVARS_PROD is empty"
            exit 1
          fi
          printf '%s\n' "$TERRAFORM_TFVARS" > terraform.tfvars

          detected_db_engine_version="$(
            awk -F= '/^[[:space:]]*db_engine_version[[:space:]]*=/ {
              value = $2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              gsub(/^"|"$/, "", value)
              print value
              exit
            }' terraform.tfvars
          )"
          echo "Detected SOH_TERRAFORM_TFVARS_PROD db_engine_version: ${detected_db_engine_version:-<missing>}"

          if grep -Eq '^[[:space:]]*db_engine_version[[:space:]]*=[[:space:]]*"8\.0"' terraform.tfvars; then
            echo "SOH_TERRAFORM_TFVARS_PROD still sets db_engine_version to 8.0."
            echo "Production RDS soh-api-prod-mysql is MySQL 8.4.10; set db_engine_version = \"8.4\" before applying."
            exit 1
          fi

          if [ -z "$detected_db_engine_version" ]; then
            echo 'db_engine_version is missing; appending db_engine_version = "8.4" for production safety.'
            printf '\n%s\n' 'db_engine_version = "8.4"' >> terraform.tfvars
          elif ! grep -Eq '^[[:space:]]*db_engine_version[[:space:]]*=[[:space:]]*"8\.4"' terraform.tfvars; then
            echo "SOH_TERRAFORM_TFVARS_PROD must set db_engine_version = \"8.4\" for production."
            exit 1
          fi

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
