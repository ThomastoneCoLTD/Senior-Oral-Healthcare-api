name: Terraform Apply Prod

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soh-api-terraform-apply-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  apply:
    name: Terraform apply prod
    runs-on: ubuntu-latest
    environment: production-infra

    defaults:
      run:
        working-directory: infra/terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write Terraform variables
        env:
          TERRAFORM_TFVARS: ${{ secrets.SOH_TERRAFORM_TFVARS_PROD_HCL }}
        run: |
          if [ -z "$TERRAFORM_TFVARS" ]; then
            echo "SOH_TERRAFORM_TFVARS_PROD is empty"
            exit 1
          fi

          # GitHub masks a multiline secret as a whole, but Terraform can echo a
          # single invalid line. Mask each line before parsing or writing it.
          while IFS= read -r tfvars_line; do
            if [ -n "$tfvars_line" ]; then
              printf '::add-mask::%s\n' "$tfvars_line"
            fi
          done <<< "$TERRAFORM_TFVARS"

          umask 077
          printf '%s\n' "$TERRAFORM_TFVARS" > terraform.tfvars

          if grep -Eiq '^[[:space:]]*(SPRING_|SERVER_|JWT_|DAEGU_|DID_|TOKEN_|CORS_|FRONTEND_)[A-Z0-9_]*[[:space:]]*=' terraform.tfvars; then
            echo "SOH_TERRAFORM_TFVARS_PROD contains application .env keys."
            echo "Replace it with Terraform HCL based on infra/terraform/environments/prod/terraform.tfvars.example."
            echo "Do not put datasource passwords, JWT secrets, tokens, or private keys in Terraform tfvars."
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*[A-Za-z0-9_]*(password|secret|token|private_key|access_key)[A-Za-z0-9_]*[[:space:]]*=' terraform.tfvars; then
            echo "SOH_TERRAFORM_TFVARS_PROD contains a forbidden sensitive variable."
            echo "RDS credentials are managed by AWS Secrets Manager and must not be stored in Terraform tfvars."
            exit 1
          fi

          for required_tfvar in project_name environment account_id artifact_bucket release_type asg_name db_identifier db_name db_username certificate_arn; do
            if ! grep -Eq "^[[:space:]]*${required_tfvar}[[:space:]]*=" terraform.tfvars; then
              echo "SOH_TERRAFORM_TFVARS_PROD is missing required Terraform variable: ${required_tfvar}"
              exit 1
            fi
          done

          detected_db_engine_version="$(
            awk -F= '/^[[:space:]]*db_engine_version[[:space:]]*=/ {
              value = $2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              gsub(/^"|"$/, "", value)
              print value
              exit
            }' terraform.tfvars
          )"
          echo "Detected SOH_TERRAFORM_TFVARS_PROD db_engine_version: ${detected_db_engine_version:-<missing>}"

          if grep -Eq '^[[:space:]]*db_engine_version[[:space:]]*=[[:space:]]*"8\.0"' terraform.tfvars; then
            echo "SOH_TERRAFORM_TFVARS_PROD still sets db_engine_version to 8.0."
            echo "Production RDS soh-api-prod-mysql is MySQL 8.4.10; set db_engine_version = \"8.4\" before applying."
            exit 1
          fi

          if [ -z "$detected_db_engine_version" ]; then
            echo 'db_engine_version is missing; appending db_engine_version = "8.4" for production safety.'
            printf '\n%s\n' 'db_engine_version = "8.4"' >> terraform.tfvars
          elif ! grep -Eq '^[[:space:]]*db_engine_version[[:space:]]*=[[:space:]]*"8\.4"' terraform.tfvars; then
            echo "SOH_TERRAFORM_TFVARS_PROD must set db_engine_version = \"8.4\" for production."
            exit 1
          fi

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
