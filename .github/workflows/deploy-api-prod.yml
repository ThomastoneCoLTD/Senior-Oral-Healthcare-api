name: Deploy SOH API Prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soh-api-prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: denti-backends
  S3_PREFIX: soh
  RELEASE_TYPE: prod
  JAR_NAME: app.jar
  ENV_FILE: .env
  ASG_NAME: soh-api-prod-asg
  APP_DIR: api_server

jobs:
  deploy:
    name: Build, upload, and refresh prod ASG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard prod API deployment target
        run: |
          test "${GITHUB_REF_NAME}" = "prod" || (echo "This workflow must run from prod branch only" && exit 1)
          test "${RELEASE_TYPE}" = "prod" || (echo "Wrong release type: ${RELEASE_TYPE}" && exit 1)
          test "${S3_PREFIX}" = "soh" || (echo "Wrong S3 prefix: ${S3_PREFIX}" && exit 1)
          test "${ASG_NAME}" = "soh-api-prod-asg" || (echo "Wrong ASG name: ${ASG_NAME}" && exit 1)

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot jar
        run: |
          set -e
          cd "${APP_DIR}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean bootJar -x test -x asciidoctor
            JAR_PATH=$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*plain*" | head -n 1)
          elif [ -f "./mvnw" ]; then
            chmod +x ./mvnw
            ./mvnw clean package -DskipTests
            JAR_PATH=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "original-*" | head -n 1)
          elif [ -f "pom.xml" ]; then
            mvn clean package -DskipTests
            JAR_PATH=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "original-*" | head -n 1)
          else
            echo "No supported build file found. Expected gradlew, mvnw, or pom.xml."
            exit 1
          fi

          test -n "${JAR_PATH}" || (echo "JAR file not found" && exit 1)
          cp "${JAR_PATH}" "../${JAR_NAME}"
          ls -lh "../${JAR_NAME}"

      - name: Create env file from GitHub Secret
        env:
          SOH_API_ENV: ${{ secrets.SOH_API_ENV_PROD }}
          DAEGU_CHAIN_APP_KEY_OVERRIDE: ${{ secrets.DAEGU_CHAIN_APP_KEY_PROD || secrets.DAEGU_CHAIN_APP_KEY }}
          DAEGU_CHAIN_TOKEN_OVERRIDE: ${{ secrets.DAEGU_CHAIN_TOKEN_PROD || secrets.DAEGU_CHAIN_TOKEN }}
          DAEGU_CHAIN_TOKEN_OWNER_ADDRESS_OVERRIDE: ${{ secrets.DAEGU_CHAIN_TOKEN_OWNER_ADDRESS_PROD || secrets.DAEGU_CHAIN_TOKEN_OWNER_ADDRESS }}
          DAEGU_CHAIN_TOKEN_OWNER_PRIVATE_KEY_OVERRIDE: ${{ secrets.DAEGU_CHAIN_TOKEN_OWNER_PRIVATE_KEY_PROD || secrets.DAEGU_CHAIN_TOKEN_OWNER_PRIVATE_KEY }}
          DAEGU_CHAIN_WALLET_ENCRYPTION_KEY_OVERRIDE: ${{ secrets.DAEGU_CHAIN_WALLET_ENCRYPTION_KEY_PROD || secrets.DAEGU_CHAIN_WALLET_ENCRYPTION_KEY }}
          TOKEN_SERVER_BASE_URL_OVERRIDE: ${{ secrets.TOKEN_SERVER_BASE_URL_PROD || secrets.TOKEN_SERVER_BASE_URL }}
          DADAEGU_LOGIN_ENABLED_OVERRIDE: ${{ secrets.DADAEGU_LOGIN_ENABLED_PROD }}
          DADAEGU_LOGIN_SITE_ID_OVERRIDE: ${{ secrets.DADAEGU_LOGIN_SITE_ID_PROD }}
          DADAEGU_LOGIN_RSA_PRIVATE_KEY_OVERRIDE: ${{ secrets.DADAEGU_LOGIN_RSA_PRIVATE_KEY_PROD }}
          DADAEGU_LOGIN_REQUIRED_VC_OVERRIDE: ${{ secrets.DADAEGU_LOGIN_REQUIRED_VC_PROD }}
        run: |
          test -n "${SOH_API_ENV}" || (echo "SOH_API_ENV_PROD secret is empty" && exit 1)
          printf '%s\n' "${SOH_API_ENV}" > "${ENV_FILE}"

          for forbidden_key in \
            SPRING_DATASOURCE_URL \
            SPRING_DATASOURCE_USERNAME \
            SPRING_DATASOURCE_PASSWORD \
            SPRING_DATASOURCE_DRIVER_CLASS_NAME; do
            if grep -Eq "^${forbidden_key}=" "${ENV_FILE}"; then
              echo "::error::${forbidden_key} must not be stored in SOH_API_ENV_PROD. RDS credentials are provided by the launch template and Secrets Manager JDBC."
              exit 1
            fi
          done

          upsert_env() {
            key="$1"
            value="$2"

            if [ -z "${value}" ]; then
              return
            fi

            tmp_file="$(mktemp)"
            grep -v "^${key}=" "${ENV_FILE}" > "${tmp_file}" || true
            printf '%s=%s\n' "${key}" "${value}" >> "${tmp_file}"
            mv "${tmp_file}" "${ENV_FILE}"
            echo "Applied ${key} override from dedicated GitHub Secret."
          }

          upsert_env "DAEGU_CHAIN_APP_KEY" "${DAEGU_CHAIN_APP_KEY_OVERRIDE}"
          upsert_env "DAEGU_CHAIN_TOKEN" "${DAEGU_CHAIN_TOKEN_OVERRIDE}"
          upsert_env "DAEGU_CHAIN_TOKEN_OWNER_ADDRESS" "${DAEGU_CHAIN_TOKEN_OWNER_ADDRESS_OVERRIDE}"
          upsert_env "DAEGU_CHAIN_TOKEN_OWNER_PRIVATE_KEY" "${DAEGU_CHAIN_TOKEN_OWNER_PRIVATE_KEY_OVERRIDE}"
          upsert_env "DAEGU_CHAIN_WALLET_ENCRYPTION_KEY" "${DAEGU_CHAIN_WALLET_ENCRYPTION_KEY_OVERRIDE}"
          upsert_env "TOKEN_SERVER_BASE_URL" "${TOKEN_SERVER_BASE_URL_OVERRIDE}"
          upsert_env "DADAEGU_LOGIN_ENABLED" "${DADAEGU_LOGIN_ENABLED_OVERRIDE}"
          upsert_env "DADAEGU_LOGIN_SITE_ID" "${DADAEGU_LOGIN_SITE_ID_OVERRIDE}"
          upsert_env "DADAEGU_LOGIN_RSA_PRIVATE_KEY" "${DADAEGU_LOGIN_RSA_PRIVATE_KEY_OVERRIDE}"
          upsert_env "DADAEGU_LOGIN_REQUIRED_VC" "${DADAEGU_LOGIN_REQUIRED_VC_OVERRIDE}"

          if [ "${DADAEGU_LOGIN_ENABLED_OVERRIDE}" = "true" ]; then
            grep -Eq '^DADAEGU_LOGIN_SITE_ID=.+' "${ENV_FILE}" \
              || (echo "DADAEGU_LOGIN_SITE_ID is required when DaDaegu login is enabled" && exit 1)
            grep -Eq '^DADAEGU_LOGIN_RSA_PRIVATE_KEY=.+' "${ENV_FILE}" \
              || (echo "DADAEGU_LOGIN_RSA_PRIVATE_KEY is required when DaDaegu login is enabled" && exit 1)
          fi

          grep -Eq '^DAEGU_CHAIN_APP_KEY=.+' "${ENV_FILE}" \
            || (echo "DAEGU_CHAIN_APP_KEY is required for the token server proxy" && exit 1)
          grep -Eq '^DAEGU_CHAIN_TOKEN=.+' "${ENV_FILE}" \
            || (echo "DAEGU_CHAIN_TOKEN is required for direct DaeguChain APIs" && exit 1)
          grep -Eq '^DAEGU_CHAIN_TOKEN_OWNER_ADDRESS=.+' "${ENV_FILE}" \
            || (echo "DAEGU_CHAIN_TOKEN_OWNER_ADDRESS is required for token owner transfer/reclaim APIs" && exit 1)
          grep -Eq '^DAEGU_CHAIN_TOKEN_OWNER_PRIVATE_KEY=.+' "${ENV_FILE}" \
            || (echo "DAEGU_CHAIN_TOKEN_OWNER_PRIVATE_KEY is required for token owner transfer/reclaim APIs" && exit 1)
          grep -Eq '^DAEGU_CHAIN_WALLET_ENCRYPTION_KEY=.+' "${ENV_FILE}" \
            || (echo "DAEGU_CHAIN_WALLET_ENCRYPTION_KEY is required for reward wallet signing key encryption" && exit 1)
          grep -Eq '^JWT_ACCESS_KEY=.{32,}$' "${ENV_FILE}" \
            || (echo "JWT_ACCESS_KEY with at least 32 characters is required" && exit 1)
          grep -Eq '^JWT_REFRESH_KEY=.{32,}$' "${ENV_FILE}" \
            || (echo "JWT_REFRESH_KEY with at least 32 characters is required" && exit 1)

          chmod 600 "${ENV_FILE}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify ASG uses the default Secrets Manager launch template
        run: |
          for attempt in {1..40}; do
            launch_template_id="$(
              aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "${ASG_NAME}" \
                --query 'AutoScalingGroups[0].LaunchTemplate.LaunchTemplateId' \
                --output text
            )"
            asg_version="$(
              aws autoscaling describe-auto-scaling-groups \
                --auto-scaling-group-names "${ASG_NAME}" \
                --query 'AutoScalingGroups[0].LaunchTemplate.Version' \
                --output text
            )"
            default_version="$(
              aws ec2 describe-launch-templates \
                --launch-template-ids "${launch_template_id}" \
                --query 'LaunchTemplates[0].DefaultVersionNumber' \
                --output text
            )"

            if [ "${asg_version}" != "${default_version}" ]; then
              echo "ASG launch template v${asg_version} is not default v${default_version}; waiting for Terraform apply."
              sleep 30
              continue
            fi

            user_data="$(
              aws ec2 describe-launch-template-versions \
                --launch-template-id "${launch_template_id}" \
                --versions "${asg_version}" \
                --query 'LaunchTemplateVersions[0].LaunchTemplateData.UserData' \
                --output text \
                | base64 --decode
            )"

            if ! grep -q 'AWSSecretsManagerMySQLDriver' <<< "${user_data}" \
              || ! grep -q 'jdbc-secretsmanager:mysql://' <<< "${user_data}"; then
              echo "::error::ASG launch template v${asg_version} does not configure Secrets Manager JDBC."
              exit 1
            fi

            echo "ASG uses default launch template v${asg_version} with Secrets Manager JDBC."
            exit 0
          done

          echo "::error::Timed out waiting for Terraform to promote the ASG launch template to the default version."
          exit 1

      - name: Upload artifacts to S3
        run: |
          aws s3 cp "${JAR_NAME}" "s3://${S3_BUCKET}/${S3_PREFIX}/${RELEASE_TYPE}/${JAR_NAME}" --only-show-errors
          aws s3 cp "${ENV_FILE}" "s3://${S3_BUCKET}/${S3_PREFIX}/${RELEASE_TYPE}/${ENV_FILE}" --only-show-errors

      - name: Wait for existing ASG instance refresh
        run: |
          for attempt in {1..60}; do
            refresh_status="$(
              aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "${ASG_NAME}" \
                --max-records 1 \
                --query 'InstanceRefreshes[0].Status' \
                --output text
            )"

            case "${refresh_status}" in
              Pending|InProgress|Cancelling|RollbackInProgress|Baking)
                echo "Existing instance refresh is ${refresh_status}; waiting before starting a new one."
                sleep 30
                ;;
              None|Successful|Failed|Cancelled|RollbackFailed|RollbackSuccessful|"")
                echo "No blocking instance refresh found. Latest status: ${refresh_status:-None}"
                exit 0
                ;;
              *)
                echo "Unexpected instance refresh status: ${refresh_status}"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for existing ${ASG_NAME} instance refresh to finish."
          exit 1

      - name: Start ASG instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${ASG_NAME}" \
            --preferences '{"InstanceWarmup":180,"MinHealthyPercentage":100}'
